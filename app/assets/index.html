<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>deepseek</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="scrim"></div>

  <aside id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div class="logo-mark">D</div>
      <div class="drawer-title">
        <strong>deepseek</strong>
        <span id="drawerSub">多模型 · 本地存储</span>
      </div>
    </div>
    <button id="newChatBtn" class="new-chat">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      新建对话
    </button>
    <div id="convList" class="conv-list"></div>
    <div class="drawer-foot">
      <button id="settingsBtn" class="drawer-foot-btn">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        设置
      </button>
      <div class="drawer-note">数据仅保存在本机</div>
    </div>
  </aside>

  <main>
    <header id="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="打开会话列表">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
      <button id="modelBtn" class="model-btn">
        <span id="modelName">选择模型</span>
        <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg>
      </button>
      <button class="icon-btn" id="newBtn" aria-label="新建对话">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </button>
    </header>

    <section id="chatWrap">
      <div id="chat">
        <div id="welcome">
          <div class="welcome-mark">D</div>
          <h1>你好，我是 deepseek</h1>
          <p>连接你自己的大模型 API，随时随地对话</p>
          <div class="suggests">
            <button class="suggest" data-p="帮我写一份本周工作周报，语气正式简洁">写一份工作周报</button>
            <button class="suggest" data-p="用通俗的方式解释一下量子纠缠">解释一个复杂概念</button>
            <button class="suggest" data-p="把下面这句话翻译成地道的英文：细节决定成败">翻译成英文</button>
            <button class="suggest" data-p="给我制定一个每周三次、每次 40 分钟的新手健身计划">制定健身计划</button>
          </div>
        </div>
      </div>
    </section>

    <footer id="composer">
      <div id="attachStrip" class="attach-strip" aria-live="polite"></div>
      <div class="composer-box" id="composerBox">
        <button id="plusBtn" class="plus-btn" aria-label="添加图片或视频">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="给 deepseek 发送消息" enterkeyhint="send"></textarea>
        <button id="sendBtn" class="send-btn" disabled aria-label="发送">
          <svg id="sendIcon" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <div class="composer-hint">内容由 AI 生成，请仔细甄别</div>
    </footer>
  </main>

  <div id="sheet">
    <div class="sheet-mask" data-close="sheet"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <div id="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
